[project]
name = "openops-core"
version = "0.1.0"
description = "Núcleo Python do OpenOps: configuração, logging estruturado, event bus, erros, registry, banco base, Business OS e API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "José Wagner Blanco Júnior" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["openops_core*", "openops_business*", "openops_api*"]

[tool.pytest.ini_options]
testpaths = ["openops_core/tests", "openops_business/tests", "openops_api/tests"]
